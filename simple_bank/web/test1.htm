
    <div id="app">
        <h1>Hardhat Web Interface</h1>
        <button onclick="connect()">Connect to Hardhat</button>
        <button onclick="getAccounts()">Get Accounts</button>
        <button onclick="getBalance()">Get Balance</button>
        <div id="output"></div>
    </div>
	

		
<script type="module">
import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js";


	

let signer = null;

let provider;

// If no %%url%% is provided, it connects to the default
// http://localhost:8545, which most nodes use.
let url = 'http://localhost:8545';
provider = new ethers.JsonRpcProvider(url)

// Get write access as an account by getting the signer
signer = await provider.getSigner();

output(signer);
output(await provider.getBlockNumber());
let balance = await provider.getBalance(signer);
let trx_count = await provider.getTransactionCount(signer);

output(balance);
output(trx_count);
output(signer.address);

const accounts = await provider.listAccounts();

for (let i = 0; i < accounts.length; i++) {
	output(accounts[i].address);
}


        function output(message) {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML += `<p>${new Date().toLocaleTimeString()}: ${message}</p>`;
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }
		
		
</script>
